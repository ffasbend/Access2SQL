name: Build Access2SQL

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ---------------------------------------------------------
  # macOS
  # ---------------------------------------------------------
  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install mdbtools
        run: |
          brew update
          brew install mdbtools

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_gui.txt
          pip install pyodbc

      - name: Build application
        run: |
          python build_mac.py

      - name: Package
        run: |
          cd dist
          zip -r ../Access2SQL-macOS.zip Access2SQL.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Access2SQL-macOS
          path: Access2SQL-macOS.zip


  # ---------------------------------------------------------
  # Windows
  # ---------------------------------------------------------
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_gui.txt
          pip install pyodbc pillow

      - name: Create ICO
        shell: python
        run: |
          from PIL import Image
          Image.open("assets/icon.png").save(
              "assets/icon.ico",
              sizes=[
                  (256,256),
                  (128,128),
                  (64,64),
                  (32,32),
                  (16,16)
              ]
          )

      - name: Build application
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean ^
            --name Access2SQL ^
            --windowed ^
            --collect-all tkinterdnd2 ^
            --collect-all customtkinter ^
            --add-data "assets;assets" ^
            --icon assets\icon.ico ^
            access2sql_gui.py

      - name: Package
        shell: powershell
        run: |
          Compress-Archive `
            -Path "dist\Access2SQL\*" `
            -DestinationPath "Access2SQL-Windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Access2SQL-Windows
          path: Access2SQL-Windows.zip


  # ---------------------------------------------------------
  # Linux
  # ---------------------------------------------------------
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mdbtools unixodbc

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_gui.txt
          pip install pyodbc

      - name: Build application
        run: |
          pyinstaller --noconfirm --clean \
            --name Access2SQL \
            --collect-all tkinterdnd2 \
            --collect-all customtkinter \
            --add-data "assets:assets" \
            access2sql_gui.py

      - name: Package
        run: |
          tar -czf Access2SQL-Linux.tar.gz -C dist Access2SQL

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Access2SQL-Linux
          path: Access2SQL-Linux.tar.gz


  # ---------------------------------------------------------
  # GitHub Release
  # ---------------------------------------------------------
  release:
    name: Create GitHub Release
    needs:
      - build-macos
      - build-windows
      - build-linux

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Access2SQL-macOS

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Access2SQL-Windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: Access2SQL-Linux

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            Access2SQL-macOS.zip \
            Access2SQL-Windows.zip \
            Access2SQL-Linux.tar.gz \
            --title "Access2SQL ${{ github.ref_name }}" \
            --generate-notes